backend:
  name: github
  repo: alermpz/MiVlog  # Update this if the repo name is different
  branch: main # Branch to update
  
media_folder: "assets" # Media files will be stored in the assets/ folder
public_folder: "assets" # The src attribute for uploaded media will begin with /assets

collections:
  - name: "settings"
    label: "Ajustes / Sobre Mí"
    files:
      - name: "about"
        label: "Sobre Mí"
        file: "content/about.json"
        description: "Tus datos personales y lo que estás escuchando/leyendo"
        fields:
          - {label: "Nombre", name: "nombre", widget: "string"}
          - {label: "Carrera/Profesión", name: "carrera", widget: "string"}
          - {label: "Libro Actual", name: "libro", widget: "string"}
          - {label: "Autor del Libro", name: "autor_libro", widget: "string"}
          - {label: "Escuchando Actual", name: "escuchando", widget: "string"}
          - {label: "Descripción Principal", name: "descripcion", widget: "text"}

  - name: "meditaciones"
    label: "Meditaciones"
    folder: "content/meditaciones"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime", format: "DD · MM · YYYY"}
      - {label: "Contenido", name: "body", widget: "markdown"}

  - name: "personajes"
    label: "Personajes"
    folder: "content/personajes"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nombre", name: "nombre", widget: "string"}
      - {label: "Serie", name: "serie", widget: "string"}
      - {label: "Descripción Breve", name: "descripcion", widget: "text"}
      - {label: "Imagen", name: "imagen", widget: "image"}
      - {label: "Destacado en Inicio", name: "destacado", widget: "boolean", default: false}

  - name: "videos"
    label: "Reseñas (Videos/Películas)"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoría", name: "categoria", widget: "select", options: ["youtube", "pelicula", "serie", "anime"]}
      - {label: "Subtítulo (Ej. fútbol & debate)", name: "subtitulo", widget: "string"}
      - {label: "Calificación (1 al 5)", name: "calificacion", widget: "number", min: 1, max: 5}
      - {label: "Reseña", name: "resena", widget: "text"}
      - {label: "Enlace (Opcional)", name: "enlace", widget: "string", required: false}
